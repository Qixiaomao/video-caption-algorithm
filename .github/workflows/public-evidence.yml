name: Public evidence checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_public_evidence.py
      - run: python scripts/audit_public_release.py
      - run: python -m compileall -q core src scripts tests reproducibility/archived_drivers
      - run: python -m unittest discover -s tests -p test_public_evidence.py -v
      - run: python -m unittest discover -s tests -p test_materialize_msrvtt_config.py -v
